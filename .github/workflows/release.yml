name: Publish latest successful build

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  copilot-requests: write

concurrency:
  group: publish-latest-opentasker-build
  cancel-in-progress: false

jobs:
  publish:
    name: Publish APK from latest successful build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Experimental
        uses: actions/checkout@v4
        with:
          ref: Experimental
          fetch-depth: 1

      - name: Find latest successful build.yml run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --branch Experimental \
            --status success \
            --limit 2 \
            --json databaseId,headSha,headBranch,createdAt)"

          run_id="$(jq -r '.[0].databaseId // empty' <<< "$run_json")"
          head_sha="$(jq -r '.[0].headSha // empty' <<< "$run_json")"
          head_branch="$(jq -r '.[0].headBranch // empty' <<< "$run_json")"
          previous_sha="$(jq -r '.[1].headSha // empty' <<< "$run_json")"

          if [[ -z "$run_id" || -z "$head_sha" ]]; then
            echo "No successful build.yml run was found on Experimental." >&2
            exit 1
          fi

          if [[ "$head_branch" != "Experimental" ]]; then
            echo "Refusing unexpected build branch: $head_branch" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          echo "Selected build run #$run_id at $head_sha"
          if [[ -n "$previous_sha" ]]; then
            echo "Previous successful build commit: $previous_sha"
          fi

      - name: Read app version and prepare comparison commit
        id: version
        env:
          BUILD_SHA: ${{ steps.build.outputs.head_sha }}
          PREVIOUS_BUILD_SHA: ${{ steps.build.outputs.previous_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin "$BUILD_SHA"

          version_name="$(
            git show "$BUILD_SHA:app/build.gradle.kts" |
              sed -nE 's/^[[:space:]]*val appVersionName = "([^"]+)".*/\1/p' |
              head -n 1
          )"

          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read a semantic appVersionName from the build commit (found: '$version_name')." >&2
            exit 1
          fi

          base_sha="$PREVIOUS_BUILD_SHA"
          if [[ -z "$base_sha" || "$base_sha" == "$BUILD_SHA" ]]; then
            base_sha="$(git show -s --format=%P "$BUILD_SHA" | awk '{print $1}')"
          fi

          if [[ -n "$base_sha" ]]; then
            git fetch --no-tags --depth=1 origin "$base_sha"
          fi

          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
          echo "asset_name=OpenTasker-v$version_name-debug.apk" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Generate release description with GitHub Copilot
        id: description
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.build.outputs.head_sha }}
          BASE_SHA: ${{ steps.version.outputs.base_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/ai-release-description.md"
          fallback_file="$RUNNER_TEMP/github-release-notes.md"
          prompt_file="$RUNNER_TEMP/copilot-prompt.txt"

          cat > "$prompt_file" <<'PROMPT'
          Write the public-facing release description for this OpenTasker Android app release.

          Inspect the Git history and source changes between BASE_SHA and BUILD_SHA. Use git log and git diff to understand what actually changed. Focus on user-visible features, improvements, and fixes. Group related changes into a short, readable Markdown description with a brief opening sentence and concise bullet points.

          Accuracy rules:
          - Only describe changes supported by the actual commits or source diff.
          - Do not invent features, claim tests passed, or describe unfinished work as shipped.
          - Avoid internal implementation details unless they matter to users.
          - Do not mention Copilot or that the text was AI-generated.
          - Keep it around 100-180 words.
          - Output only the release description in Markdown, with no preamble or commentary.
          PROMPT

          prompt="$(cat "$prompt_file")
          Version: $VERSION
          Comparison base commit: ${BASE_SHA:-none}
          Release build commit: $BUILD_SHA

          When BASE_SHA is available, compare BASE_SHA..BUILD_SHA. Otherwise, summarize BUILD_SHA itself."

          copilot_ok=false
          if npm install --global @github/copilot >/dev/null 2>&1; then
            if copilot -p "$prompt" -s \
              --allow-tool='shell(git:*)' \
              --no-ask-user > "$notes_file" 2>"$RUNNER_TEMP/copilot-stderr.log"; then
              if [[ -s "$notes_file" ]] && [[ "$(wc -c < "$notes_file")" -le 20000 ]]; then
                copilot_ok=true
                echo "Copilot generated the release description."
              fi
            fi
          fi

          if [[ "$copilot_ok" != true ]]; then
            echo "::warning::Copilot release description was unavailable; using GitHub-generated release notes instead."
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$VERSION" \
              -f target_commitish="$BUILD_SHA" \
              --jq .body > "$fallback_file"

            if [[ ! -s "$fallback_file" ]]; then
              echo "GitHub did not return release notes and Copilot was unavailable." >&2
              exit 1
            fi
            cp "$fallback_file" "$notes_file"
          fi

          {
            printf 'description_source=%s\n' "$([[ "$copilot_ok" == true ]] && echo copilot || echo github)"
          } >> "$GITHUB_OUTPUT"

          echo "description_path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Download the APK artifact from that build
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          ASSET_NAME: ${{ steps.version.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/opentasker-artifact"
          apk_path="$RUNNER_TEMP/$ASSET_NAME"
          mkdir -p "$artifact_dir"

          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name OpenTasker-debug-apk \
            --dir "$artifact_dir"

          mapfile -t apk_files < <(find "$artifact_dir" -type f -name '*.apk' -print)

          if [[ "${#apk_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK in OpenTasker-debug-apk; found ${#apk_files[@]}." >&2
            find "$artifact_dir" -maxdepth 3 -type f -print >&2
            exit 1
          fi

          cp "${apk_files[0]}" "$apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "Prepared $ASSET_NAME"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          BUILD_SHA: ${{ steps.build.outputs.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET_NAME: ${{ steps.version.outputs.asset_name }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          DESCRIPTION_PATH: ${{ steps.description.outputs.description_path }}
          DESCRIPTION_SOURCE: ${{ steps.description.outputs.description_source }}
        shell: bash
        run: |
          set -euo pipefail

          title="OpenTasker v$VERSION"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID"
          marker="<!-- opentasker-build-run-id:$BUILD_RUN_ID -->"
          notes_file="$RUNNER_TEMP/release-notes.md"
          release_json="$RUNNER_TEMP/existing-release.json"

          {
            cat "$DESCRIPTION_PATH"
            printf '\n\n---\n\n'
            printf 'APK: **%s**\n\n' "$ASSET_NAME"
            printf 'Built by [successful build.yml run #%s](%s) from commit `%s`.\n\n' "$BUILD_RUN_ID" "$run_url" "$BUILD_SHA"
            printf '%s\n\n' '**Install note:** This is a debug APK. The build workflow generates a fresh debug signing key for each run, so Android may require uninstalling an earlier OpenTasker build before installing this APK.'
            printf '<!-- description-source:%s -->\n' "$DESCRIPTION_SOURCE"
            printf '%s\n' "$marker"
          } > "$notes_file"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,body > "$release_json" 2>/dev/null; then

            existing_body="$(jq -r '.body // ""' "$release_json")"
            has_asset=false
            if jq -e --arg name "$ASSET_NAME" '.assets[]? | select(.name == $name)' "$release_json" >/dev/null; then
              has_asset=true
            fi

            if [[ "$has_asset" == true && "$existing_body" == *"$marker"* ]]; then
              echo "Release $TAG already contains this exact build run and APK; nothing to do."
              exit 0
            fi

            gh release upload "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes_file"

            echo "Updated release $TAG with build run #$BUILD_RUN_ID."
          else
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --target "$BUILD_SHA" \
              --notes-file "$notes_file"

            echo "Created release $TAG from build run #$BUILD_RUN_ID."
          fi
