name: Publish latest successful build

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-latest-opentasker-build
  cancel-in-progress: false

jobs:
  publish:
    name: Publish APK from latest successful build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Experimental
        uses: actions/checkout@v4
        with:
          ref: Experimental
          fetch-depth: 0

      - name: Find latest successful build.yml run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --branch Experimental \
            --status success \
            --limit 2 \
            --json databaseId,headSha,headBranch,createdAt)"

          run_id="$(jq -r '.[0].databaseId // empty' <<< "$run_json")"
          head_sha="$(jq -r '.[0].headSha // empty' <<< "$run_json")"
          head_branch="$(jq -r '.[0].headBranch // empty' <<< "$run_json")"
          previous_sha="$(jq -r '.[1].headSha // empty' <<< "$run_json")"

          if [[ -z "$run_id" || -z "$head_sha" ]]; then
            echo "No successful build.yml run was found on Experimental." >&2
            exit 1
          fi

          if [[ "$head_branch" != "Experimental" ]]; then
            echo "Refusing unexpected build branch: $head_branch" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          echo "Selected build run #$run_id at $head_sha"
          if [[ -n "$previous_sha" ]]; then
            echo "Previous successful build commit: $previous_sha"
          fi

      - name: Read app version from the selected build commit
        id: version
        env:
          BUILD_SHA: ${{ steps.build.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          version_name="$(
            git show "$BUILD_SHA:app/build.gradle.kts" |
              sed -nE 's/^[[:space:]]*val appVersionName = "([^"]+)".*/\1/p' |
              head -n 1
          )"

          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read a semantic appVersionName from the build commit (found: '$version_name')." >&2
            exit 1
          fi

          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
          echo "asset_name=OpenTasker-v$version_name-debug.apk" >> "$GITHUB_OUTPUT"


      - name: Detect changes for the release description
        id: changes
        env:
          BUILD_SHA: ${{ steps.build.outputs.head_sha }}
          PREVIOUS_BUILD_SHA: ${{ steps.build.outputs.previous_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          description_path="$RUNNER_TEMP/detected-release-description.md"
          bash tools/generate-release-description.sh \
            "$BUILD_SHA" \
            "$VERSION" \
            "$description_path" \
            "$PREVIOUS_BUILD_SHA"

          if [[ ! -s "$description_path" ]]; then
            echo "Automatic release description is empty." >&2
            exit 1
          fi

          echo "description_path=$description_path" >> "$GITHUB_OUTPUT"

      - name: Download the APK artifact from that build
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          ASSET_NAME: ${{ steps.version.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/opentasker-artifact"
          apk_path="$RUNNER_TEMP/$ASSET_NAME"
          mkdir -p "$artifact_dir"

          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name OpenTasker-debug-apk \
            --dir "$artifact_dir"

          mapfile -t apk_files < <(find "$artifact_dir" -type f -name '*.apk' -print)

          if [[ "${#apk_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK in OpenTasker-debug-apk; found ${#apk_files[@]}." >&2
            find "$artifact_dir" -maxdepth 3 -type f -print >&2
            exit 1
          fi

          cp "${apk_files[0]}" "$apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "Prepared $ASSET_NAME"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          BUILD_SHA: ${{ steps.build.outputs.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET_NAME: ${{ steps.version.outputs.asset_name }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          DESCRIPTION_PATH: ${{ steps.changes.outputs.description_path }}
        shell: bash
        run: |
          set -euo pipefail

          title="OpenTasker v$VERSION"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID"
          marker="<!-- opentasker-build-run-id:$BUILD_RUN_ID -->"
          notes_file="$RUNNER_TEMP/release-notes.md"
          release_json="$RUNNER_TEMP/existing-release.json"

          {
            cat "$DESCRIPTION_PATH"
            printf '\n\n---\n\n'
            printf 'APK: **%s**\n\n' "$ASSET_NAME"
            printf 'Built by [successful build.yml run #%s](%s) from commit \`%s\`.\n\n' "$BUILD_RUN_ID" "$run_url" "$BUILD_SHA"
            printf '%s\n\n' '**Install note:** This is a debug APK. The build workflow generates a fresh debug signing key for each run, so Android may require uninstalling an earlier OpenTasker build before installing this APK.'
            printf '%s\n' "$marker"
          } > "$notes_file"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,body > "$release_json" 2>/dev/null; then

            existing_body="$(jq -r '.body // ""' "$release_json")"
            has_asset=false
            if jq -e --arg name "$ASSET_NAME" '.assets[]? | select(.name == $name)' "$release_json" >/dev/null; then
              has_asset=true
            fi

            if [[ "$has_asset" == true && "$existing_body" == *"$marker"* ]]; then
              echo "Release $TAG already contains this exact build run and APK; nothing to do."
              exit 0
            fi

            gh release upload "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes_file"

            echo "Updated release $TAG with build run #$BUILD_RUN_ID."
          else
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --target "$BUILD_SHA" \
              --notes-file "$notes_file"

            echo "Created release $TAG from build run #$BUILD_RUN_ID."
          fi
