name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # CONTRIBUTING.md says JDK 17 or 21. AGP 9 runs fine on either.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Validates the checked-in wrapper JAR against Gradle's published
      # checksums, then caches ~/.gradle between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      # ubuntu-latest ships the Android SDK; this lets AGP fetch any
      # missing platform or build-tools package without prompting.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opentasker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
