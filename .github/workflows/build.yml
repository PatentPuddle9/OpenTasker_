name: Build OpenTasker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK manually
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret DEBUG_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          # The secret may have been pasted with terminal line wrapping. Remove
          # whitespace, but reject every other non-Base64 character.
          encoded_key="$(printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [[ ! "$encoded_key" =~ ^[A-Za-z0-9+/]*={0,2}$ ]] ||
             (( ${#encoded_key} == 0 || ${#encoded_key} % 4 != 0 )); then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not a complete Base64 value. Recreate it from ~/.android/debug.keystore and replace the repository secret."
            exit 1
          fi

          mkdir -p ~/.android
          if ! printf '%s' "$encoded_key" | base64 --decode > ~/.android/debug.keystore; then
            rm -f ~/.android/debug.keystore
            echo "::error::DEBUG_KEYSTORE_BASE64 could not be decoded. The saved secret may be truncated or corrupted."
            exit 1
          fi
          chmod 600 ~/.android/debug.keystore

          if ! key_entry="$(keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>&1)"; then
            rm -f ~/.android/debug.keystore
            echo "::error::Decoded file is not a usable debug keystore with alias androiddebugkey. Check the secret and original file."
            exit 1
          fi
          if ! grep -q "PrivateKeyEntry" <<< "$key_entry"; then
            rm -f ~/.android/debug.keystore
            echo "::error::The saved keystore does not contain the expected androiddebugkey private key."
            exit 1
          fi
          echo "Persistent androiddebugkey keystore restored and verified."

      - name: Verify locale resources
        run: ./gradlew :app:verifyLocaleResources --stacktrace --dependency-verification=off

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --dependency-verification=off

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTasker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
