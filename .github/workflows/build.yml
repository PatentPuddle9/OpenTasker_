name: Build OpenTasker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK manually
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0"

      - name: Calculate unique app version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(sed -nE 's/^[[:space:]]*val baseAppVersionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          base_version_code="$(sed -nE 's/^[[:space:]]*val baseAppVersionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"

          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$base_version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read the base app version from app/build.gradle.kts."
            exit 1
          fi

          IFS='.' read -r major minor base_patch <<< "$base_version"
          run_number="$GITHUB_RUN_NUMBER"
          version_patch=$((base_patch + run_number))
          version_code=$((base_version_code + run_number))
          if (( version_code <= 0 || version_code > 2100000000 )); then
            echo "::error::Generated Android versionCode is outside the supported range."
            exit 1
          fi

          version_name="$major.$minor.$version_patch"
          echo "OPENTASKER_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "OPENTASKER_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

          echo "This run will build OpenTasker v$version_name (Android versionCode $version_code)."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret DEBUG_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          # The secret may have been pasted with terminal line wrapping. Remove
          # whitespace, but reject every other non-Base64 character.
          encoded_key="$(printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [[ ! "$encoded_key" =~ ^[A-Za-z0-9+/]*={0,2}$ ]] ||
             (( ${#encoded_key} == 0 || ${#encoded_key} % 4 != 0 )); then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not a complete Base64 value. Recreate it from ~/.android/debug.keystore and replace the repository secret."
            exit 1
          fi

          mkdir -p ~/.android
          if ! printf '%s' "$encoded_key" | base64 --decode > ~/.android/debug.keystore; then
            rm -f ~/.android/debug.keystore
            echo "::error::DEBUG_KEYSTORE_BASE64 could not be decoded. The saved secret may be truncated or corrupted."
            exit 1
          fi
          chmod 600 ~/.android/debug.keystore

          if ! key_entry="$(keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>&1)"; then
            rm -f ~/.android/debug.keystore
            echo "::error::Decoded file is not a usable debug keystore with alias androiddebugkey. Check the secret and original file."
            exit 1
          fi
          if ! grep -q "PrivateKeyEntry" <<< "$key_entry"; then
            rm -f ~/.android/debug.keystore
            echo "::error::The saved keystore does not contain the expected androiddebugkey private key."
            exit 1
          fi
          echo "Persistent androiddebugkey keystore restored and verified."

      - name: Verify locale resources
        run: ./gradlew :app:verifyLocaleResources --stacktrace --dependency-verification=off

      - name: Build debug APK
        run: |
          ./gradlew \
            -PopenTaskerVersionName="$OPENTASKER_VERSION_NAME" \
            -PopenTaskerVersionCode="$OPENTASKER_VERSION_CODE" \
            -PopenTaskerBuildBranch="$GITHUB_REF_NAME" \
            :app:assembleDebug --stacktrace --dependency-verification=off

      - name: Write build metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/debug
          {
            printf 'versionName=%s\n' "$OPENTASKER_VERSION_NAME"
            printf 'versionCode=%s\n' "$OPENTASKER_VERSION_CODE"
            printf 'runNumber=%s\n' "$GITHUB_RUN_NUMBER"
          } > app/build/outputs/apk/debug/build-info.txt

      - name: Upload APK and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: OpenTasker-${{ github.ref_name }}-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
